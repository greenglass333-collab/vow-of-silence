<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, onValue, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBCG8EOJQVe2TeJLIfCWQqHnuLcMqsgEPU",
  authDomain: "vow-of-silence-e2c93.firebaseapp.com",
  databaseURL: "https://vow-of-silence-e2c93-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "vow-of-silence-e2c93",
  storageBucket: "vow-of-silence-e2c93.firebasestorage.app",
  messagingSenderId: "63020183712",
  appId: "1:63020183712:web:7a18d5c051d77b8a5759c5",
  measurementId: "G-ENSV95H5Y4"
};

const ZERO = () => ({ stu: 0, inc: 0, pro: 0, hea: 0, exp: 0 });
const DEFAULT_USERS = [
  { id: 'harry', pw: '1234', name: '해리', team: 'P', role: 'user', xp: 0, lv: ZERO() },
  { id: 'ron', pw: '1234', name: '론', team: 'P', role: 'user', xp: 0, lv: ZERO() },
  { id: 'hermione', pw: '1234', name: '헤르미온느', team: 'P', role: 'user', xp: 0, lv: ZERO() },
  { id: 'draco', pw: '1234', name: '드레이코', team: 'D', role: 'user', xp: 0, lv: ZERO() },
  { id: 'bella', pw: '1234', name: '벨라트릭스', team: 'D', role: 'user', xp: 0, lv: ZERO() },
  { id: 'lucius', pw: '1234', name: '루시우스', team: 'D', role: 'user', xp: 0, lv: ZERO() },
  { id: 'admin', pw: 'admin', name: '관리자', team: 0, role: 'admin', xp: 0, lv: ZERO() }
];

const appFB = initializeApp(firebaseConfig);
const db = getDatabase(appFB);
const gameRef = ref(db, 'vow_of_silence_game');

const SK = {
  stu: ['스투페파이', 10, '단일 공격. 대상의 체력이 낮을수록 더 큰 피해 (무제한)'],
  inc: ['인센디오', 2, '상대 진영 전체 공격'],
  pro: ['프로테고', 3, '같은 진영 1인의 피해를 막음'],
  hea: ['치유 주문', 1, '같은 진영 1인의 HP를 회복'],
  exp: ['엑스펠리아무스', 3, '상대를 일시 불능으로 만듦']
};
const LV = {
  stu: { r: [[5, 20], [7, 25], [7, 25], [10, 30], [12, 35]], p: [0, 0, 5, 10, 15], u: [10, 10, 10, 10, 10], c: [5, 10, 20, 40] },
  inc: { r: [[3, 15], [5, 20], [5, 20], [7, 25], [7, 30]], p: [0, 0, 15, 25, 40], u: [2, 2, 2, 2, 2], c: [7, 14, 28, 56] },
  pro: { r: [[5, 20], [7, 25], [7, 25], [10, 30], [12, 35]], u: [3, 3, 4, 4, 5], c: [5, 10, 20, 40] },
  hea: { r: [[1, 99], [10, 99], [10, 99], [10, 99], [10, 99]], u: [1, 1, 2, 3, 4], c: [10, 20, 40, 80] },
  exp: { r: [[1, 3], [2, 4], [2, 4], [2, 4], [2, 4]], u: [3, 3, 4, 4, 5], c: [10, 20, 40, 80] }
};
const desc = (k, l) => {
  const r = LV[k].r[l], p = (LV[k].p || [])[l], u = LV[k].u[l];
  const t = { stu: `데미지 ${r[0]}~${r[1]}`, inc: `전체 데미지 ${r[0]}~${r[1]}`, pro: `방어 ${r[0]}~${r[1]}`, hea: `회복 ${r[0]}~${r[1]}`, exp: `일시 불능 ${r[0]}~${r[1]}턴` }[k];
  return t + (p ? (k === 'stu' ? ` · ${p}% 확률 일시 불능` : ` · ${p}% 확률 지속 피해(턴당 1~7, 1~3턴)`) : '') + (k === 'stu' ? ' · 사용 무제한' : ` · 사용 ${u}회`);
};

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const j = (s, a, b) => { const c = s.charCodeAt(s.length - 1) - 44032; return c >= 0 && c < 11172 && c % 28 ? a : b; };
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[R(0, a.length - 1)];
const shuf = a => a.map(x => [Math.random(), x]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
const kstDay = () => new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Seoul' });
const kstNow = () => new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Seoul' }));

let cache = null, myUser = null, watchSlot = 0, busy = false;

function initSlots(times, auto, users) {
  const S = times.map((time, i) => ({ n: i + 1, time, P: [], D: [], B: null, x: 0 }));
  Object.entries(auto || {}).forEach(([id, n]) => {
    if (!n) return;
    const u = users.find(x => x.id === id), s = S[n - 1];
    if (u && s && u.team && s[u.team].length < 3 && !s[u.team].some(x => x.id === u.id)) {
      s[u.team].push({ id: u.id, name: u.name, team: u.team });
    }
  });
  return S;
}

function normB(B, n) {
  if (!B) return null;
  const rawPend = B.pend || {};
  const pendDot = {};
  if (rawPend.dot) Object.entries(rawPend.dot).forEach(([k, v]) => pendDot[k] = Array.isArray(v) ? v : Object.values(v));
  return {
    n: B.n || n,
    turn: B.turn || 0,
    i: B.i ?? -1,
    cur: B.cur || null,
    turnStart: B.turnStart || Date.now(),
    order: B.order ? Object.values(B.order) : [],
    units: B.units ? Object.values(B.units).map(u => ({
      ...u,
      dot: u.dot ? (Array.isArray(u.dot) ? u.dot : Object.values(u.dot)) : [],
      lv: Object.assign(ZERO(), u.lv || {}),
      uses: u.uses || { stu: 10, inc: 2, pro: 3, hea: 1, exp: 3 }
    })) : [],
    log: B.log ? Object.values(B.log) : [],
    spec: B.spec || {},
    over: B.over || null,
    xpGiven: !!B.xpGiven,
    sc: B.sc || { P: 0, D: 0 },
    dm: B.dm || { P: 0, D: 0 },
    end: B.end || Date.now() + 36e5,
    pend: {
      dmg: rawPend.dmg || {},
      sh: rawPend.sh || {},
      heal: rawPend.heal || {},
      exp: rawPend.exp || {},
      dot: pendDot
    }
  };
}

function norm(raw) {
  const today = kstDay();
  const rawUsers = raw && raw.users ? (Array.isArray(raw.users) ? raw.users : Object.values(raw.users)) : DEFAULT_USERS.map(u => ({ ...u, lv: ZERO() }));
  const users = rawUsers.map(u => ({ ...u, xp: u.xp || 0, lv: Object.assign(ZERO(), u.lv || {}) }));
  if (!users.some(u => u.role === 'admin')) users.push({ id: 'admin', pw: 'admin', name: '관리자', team: 0, role: 'admin', xp: 0, lv: ZERO() });
  if (!raw || !raw.times) {
    const times = ['16:00', '17:00', '18:00', '19:00'];
    return { day: today, times, auto: {}, users, S: initSlots(times, {}, users) };
  }
  const times = Array.isArray(raw.times) ? raw.times : Object.values(raw.times);
  const auto = raw.auto || {};
  if (raw.day !== today) return { day: today, times, auto, users, S: initSlots(times, auto, users) };
  const rawS = raw.S ? (Array.isArray(raw.S) ? raw.S : Object.values(raw.S)) : initSlots(times, auto, users);
  const S = rawS.map((s, i) => ({
    n: s.n || i + 1,
    time: s.time || times[i] || '16:00',
    P: s.P ? Object.values(s.P) : [],
    D: s.D ? Object.values(s.D) : [],
    x: s.x || 0,
    B: normB(s.B, s.n || i + 1)
  }));
  return { day: raw.day, times, auto, users, S };
}

const tg = u => u.hp <= 0 ? ['행동 불능'] : [...(u.inc ? ['일시 불능'] : []), ...(u.hp < 30 ? ['빈사'] : []), ...(u.dot && u.dot.length ? ['지속 피해'] : [])];
const st = s => s.B ? (s.B.over ? 'done' : 'live') : s.x ? 'cancel' : s.P.length + s.D.length === 6 ? 'full' : 'open';
const sys = (B, text) => B.log.push({ k: 'sys', text });

function viewBattle(B) {
  const t = x => B.units.filter(u => u.team === x).map(u => ({ id: u.id, name: u.name, hp: u.hp, tags: tg(u), uses: u.uses, lv: u.lv }));
  return { n: B.n, turn: B.turn, cur: B.cur || null, teams: { P: t('P'), D: t('D') }, score: B.sc, spec: Object.values(B.spec || {}), log: B.log, over: B.over };
}

function startBattle(s, users) {
  const mk = u => {
    const acc = (users || []).find(z => z.id === u.id);
    const lv = Object.assign(ZERO(), acc ? acc.lv : {});
    const uses = {};
    Object.keys(SK).forEach(k => uses[k] = LV[k].u[lv[k]]);
    return { id: u.id, name: u.name, team: u.team, hp: 100, inc: 0, dot: [], bot: !!u.bot, lv, uses };
  };
  const B = s.B = { n: s.n, turn: 0, i: -1, cur: null, turnStart: Date.now(), order: [], units: [...s.P, ...s.D].map(mk), log: [], spec: {}, over: null, xpGiven: false, sc: { P: 0, D: 0 }, dm: { P: 0, D: 0 }, end: Date.now() + 36e5, pend: { dmg: {}, sh: {}, heal: {}, exp: {}, dot: {} } };
  sys(B, '전투가 시작되었습니다.');
  nextTurn(B);
}

function nextTurn(B) {
  B.turn++;
  B.order = shuf(B.units.filter(u => u.hp > 0 && !u.inc).map(u => u.id));
  B.i = -1;
  B.pend = { dmg: {}, sh: {}, heal: {}, exp: {}, dot: {} };
  advance(B);
}

function advance(B) {
  B.i++;
  if (B.i >= B.order.length) { B.cur = null; return endTurn(B); }
  B.cur = B.order[B.i];
  B.turnStart = Date.now();
}

function applyAct(B, uid, d) {
  if (B.over || B.cur !== uid) return false;
  const u = B.units.find(x => x.id === uid);
  if (!u) return false;
  if (u.bot && !d.skill) {
    const en = B.units.filter(x => x.team !== u.team && x.hp > 0);
    const al = B.units.filter(x => x.team === u.team && x.hp > 0);
    const ks = Object.keys(u.uses).filter(k => (k === 'stu' || u.uses[k] > 0) && (k !== 'hea' || al.some(a => a.hp < 60)));
    if (ks.length && en.length) {
      const skill = pick(ks);
      d = { skill, target: (skill === 'pro' || skill === 'hea' ? pick(al) : pick(en)).id, text: '주문을 외우며 지팡이를 겨눈다.' };
    }
  }
  const k = d.skill, P = B.pend;
  if (!k) {
    sys(B, `${u.name}${j(u.name, '이', '가')} 행동하지 않았습니다.`);
  } else {
    if (!SK[k] || (k !== 'stu' && u.uses[k] < 1)) return false;
    const ally = k === 'pro' || k === 'hea';
    const t = B.units.find(x => x.id === d.target) || (ally ? u : null);
    if (k !== 'inc' && (!t || t.hp <= 0 || (ally ? t.team !== u.team : t.team === u.team))) return false;
    const add = (o, id, v) => o[id] = (o[id] || 0) + v;
    const mx = (id, n) => P.exp[id] = Math.max(P.exp[id] || 0, n);
    const L = (u.lv && u.lv[k]) || 0, [lo, hi] = LV[k].r[L], pc = (LV[k].p || [])[L] || 0;
    const eff = [], en = B.units.filter(x => x.team !== u.team && x.hp > 0);
    let lab = '데미지', v = 0;
    if (k !== 'stu') u.uses[k]--;
    if (k === 'stu') {
      v = Math.round(R(lo, hi) * (2 - t.hp / 100));
      add(P.dmg, t.id, v);
      if (R(1, 100) <= pc) { mx(t.id, 1); eff.push('일시 불능'); }
    } else if (k === 'inc') {
      en.forEach(x => { const w = R(lo, hi); v += w; add(P.dmg, x.id, w); });
      if (R(1, 100) <= pc) {
        shuf(en).slice(0, R(1, Math.min(3, en.length))).forEach(x => (P.dot[x.id] = P.dot[x.id] || []).push(R(1, 3)));
        eff.push('지속 피해');
      }
    } else if (k === 'pro') { lab = '방어'; v = R(lo, hi); add(P.sh, t.id, v); }
    else if (k === 'hea') { lab = '회복'; v = R(lo, hi); add(P.heal, t.id, v); }
    else { mx(t.id, R(lo, hi)); eff.push('일시 불능'); }
    const to = k === 'inc' ? '전체' : t.name;
    B.log.push({ k: 'chat', name: u.name, to, text: d.text || '(말없이 지팡이를 든다)', turn: B.turn });
    sys(B, `${u.name}${j(u.name, '이', '가')} ${SK[k][0]}${j(SK[k][0], '을', '를')} ${to}에게 사용하였습니다. ${lab} ${v}, 특수효과 ${eff.join(', ') || '없음'} 적용.`);
  }
  advance(B);
  return true;
}

function endTurn(B) {
  const P = B.pend, L = [];
  B.units.forEach(u => { if (u.inc > 0) { u.inc--; if (!u.inc) L.push(`${u.name}: [일시 불능] 해제되었습니다.`); } });
  B.units.forEach(u => {
    const raw = P.dmg[u.id] || 0, sh = P.sh[u.id] || 0, hl = P.heal[u.id] || 0, old = u.hp;
    let dt = 0;
    const had = u.dot && u.dot.length;
    if (old > 0 && had) { u.dot = u.dot.map(n => { dt += R(1, 7); return n - 1; }).filter(n => n > 0); }
    const d = Math.max(0, raw - sh) + dt, mid = Math.max(0, old - d);
    u.hp = Math.max(0, Math.min(100, old - d + hl));
    const lost = Math.min(d, old);
    B.dm[u.team === 'P' ? 'D' : 'P'] += lost;
    if (raw) L.push(sh ? `${u.name}: 방어로 ${Math.min(raw, sh)} 막아냄, ${Math.max(0, raw - sh)} 데미지` : `${u.name}: ${raw} 데미지를 입었습니다.`);
    else if (sh) L.push(`${u.name}: 방어가 발동됩니다. HP 차감 없음`);
    if (dt) L.push(`${u.name}: [지속 피해] ${dt} 데미지`);
    if (had && !u.dot.length) L.push(`${u.name}: [지속 피해] 해제되었습니다.`);
    if (hl) L.push(`${u.name}: HP ${Math.max(0, u.hp - mid)} 회복`);
    if (raw || dt || hl) L.push(`${u.name}: 현재 HP ${u.hp}`);
    if (u.hp <= 0) { u.inc = 0; u.dot = []; if (old > 0) L.push(`${u.name}: [행동 불능] 상태가 되었습니다.`); }
    else {
      if (P.exp[u.id]) { u.inc = Math.max(u.inc, P.exp[u.id]); L.push(`${u.name}: [일시 불능] ${B.turn + u.inc}턴까지 지속`); }
      if (P.dot[u.id]) { u.dot.push(...P.dot[u.id]); L.push(`${u.name}: [지속 피해] ${Math.max(...P.dot[u.id])}턴간 적용`); }
    }
  });
  B.sc.P = Math.floor(B.dm.P / 10);
  B.sc.D = Math.floor(B.dm.D / 10);
  sys(B, `— ${B.turn}번째 턴 종료 —`);
  L.forEach(t => sys(B, t));
  const dead = x => B.units.filter(u => u.team === x).every(u => u.hp <= 0);
  if (dead('P') || dead('D')) return finBattle(B, '전원 행동 불능');
  nextTurn(B);
}

function finBattle(B, why) {
  if (B.over) return;
  const t = x => B.units.filter(u => u.team === x).reduce((a, u) => a + u.hp, 0);
  const w = B.sc.P !== B.sc.D ? (B.sc.P > B.sc.D ? 'P' : 'D') : t('P') === t('D') ? '' : t('P') > t('D') ? 'P' : 'D';
  B.over = { w };
  B.cur = null;
  sys(B, `전투 종료 (${why}). ${w ? (w === 'P' ? '불사조 기사단' : '죽음을 먹는 자') + '의 승리!' : '무승부'}`);
  sys(B, w ? '경험치 지급: 승리 진영 +5, 패배 진영 +2 (참가자 한정)' : '경험치 지급: 무승부, 참가자 +3');
}

function awardXP(M, B) {
  if (!B || !B.over || B.xpGiven) return;
  const w = B.over.w;
  B.units.filter(u => !u.bot).forEach(u => {
    const a = M.users.find(z => z.id === u.id);
    if (a) a.xp = (a.xp || 0) + (w ? (u.team === w ? 5 : 2) : 3);
  });
  B.xpGiven = true;
}

async function saveBattle(slotNum, b) {
  if (b.over && !b.xpGiven) {
    const snap = await get(gameRef);
    const M = norm(snap.val());
    M.S[slotNum - 1].B = b;
    awardXP(M, M.S[slotNum - 1].B);
    await set(gameRef, M);
  } else {
    await set(ref(db, `vow_of_silence_game/S/${slotNum - 1}/B`), b);
  }
}

function publishState(M) {
  net.emit('slots', M.S.map(s => ({ n: s.n, time: s.time, P: s.P.map(u => u.name), D: s.D.map(u => u.name), score: s.B ? [s.B.sc.P, s.B.sc.D] : [0, 0], status: st(s) })));
  const s = M.S[watchSlot - 1];
  if (s && s.B) net.emit('battle', viewBattle(s.B));
}

onValue(gameRef, snap => {
  if (!snap.exists()) {
    set(gameRef, norm(null));
    return;
  }
  cache = norm(snap.val());
  publishState(cache);
});

/* 턴 자동 진행 감시 (봇 1.2초 / 유저 미응답 45초 자동 패스) */
setInterval(async () => {
  if (!cache || !myUser || !watchSlot || busy) return;
  const s = cache.S[watchSlot - 1];
  if (!s || !s.B || s.B.over || !s.B.cur) return;
  const curU = s.B.units.find(u => u.id === s.B.cur);
  if (!curU) return;
  const elapsed = Date.now() - (s.B.turnStart || 0);
  const limit = curU.bot ? 1200 : 45000;
  if (elapsed < limit) return;
  busy = true;
  try {
    const bRef = ref(db, `vow_of_silence_game/S/${watchSlot - 1}/B`);
    const snap = await get(bRef);
    if (snap.exists()) {
      const b = normB(snap.val(), watchSlot);
      if (b && b.cur === curU.id && !b.over && Date.now() - (b.turnStart || 0) >= limit) {
        if (applyAct(b, curU.id, {})) await saveBattle(watchSlot, b);
      }
    }
  } catch (e) { console.error(e); }
  busy = false;
}, 1200);

setInterval(async () => {
  if (!cache) return;
  const now = kstNow(), today = kstDay();
  let need = cache.day !== today;
  cache.S.forEach(s => {
    const [h, m] = s.time.split(':'), t = kstNow();
    t.setHours(+h, +m, 0, 0);
    if (!s.B && !s.x && now >= t) need = true;
    if (s.B && !s.B.over && Date.now() > s.B.end) need = true;
  });
  if (need) {
    const snap = await get(gameRef);
    const M = norm(snap.val());
    M.S.forEach(s => {
      const [h, m] = s.time.split(':'), t = kstNow();
      t.setHours(+h, +m, 0, 0);
      if (!s.B && !s.x && now >= t) {
        if (s.P.length + s.D.length === 6) startBattle(s, M.users);
        else s.x = 1;
      }
      if (s.B && !s.B.over && Date.now() > s.B.end) {
        finBattle(s.B, '제한 시간 1시간 경과');
        awardXP(M, s.B);
      }
    });
    await set(gameRef, M);
  }
}, 3000);

const net = {
  h: {},
  on(t, f) { (this.h[t] = this.h[t] || []).push(f); },
  emit(t, d) { (this.h[t] || []).forEach(f => f(d)); },
  async send(t, d = {}) {
    if (!cache) {
      const snap = await get(gameRef);
      cache = norm(snap.val());
    }
    if (t === 'login') {
      const u = cache.users.find(x => x.id === d.id && x.pw === d.pw);
      if (!u) throw 0;
      myUser = u;
      return { id: u.id, name: u.name, team: u.team, role: u.role, auto: (cache.auto && cache.auto[u.id]) || 0 };
    }
    if (t === 'slots') { publishState(cache); return 1; }
    if (!myUser) throw 0;
    const adm = () => { if (myUser.role !== 'admin') throw 0; };
    if (t === 'profile') {
      const u = cache.users.find(x => x.id === myUser.id) || myUser;
      return { xp: u.xp || 0, lv: Object.assign(ZERO(), u.lv || {}) };
    }
    if (t === 'users') { adm(); return cache.users.map(u => ({ id: u.id, name: u.name, team: u.team, role: u.role, xp: u.xp || 0, lv: Object.assign(ZERO(), u.lv || {}) })); }
    if (t === 'act') {
      const bRef = ref(db, `vow_of_silence_game/S/${d.n - 1}/B`);
      const snap = await get(bRef);
      if (!snap.exists()) throw 0;
      const b = normB(snap.val(), d.n);
      if (!applyAct(b, myUser.id, d)) throw 0;
      await saveBattle(d.n, b);
      return 1;
    }
    if (t === 'enter') watchSlot = d.n;
    const snap = await get(gameRef);
    const M = norm(snap.val());
    if (t === 'apply') {
      const s = M.S[d.n - 1];
      if (!s || s.B || s.x || !myUser.team || s[myUser.team].length >= 3 || s[myUser.team].some(x => x.id === myUser.id)) throw 0;
      s[myUser.team].push({ id: myUser.id, name: myUser.name, team: myUser.team });
    } else if (t === 'cancel') {
      const s = M.S[d.n - 1];
      if (!s || s.B) throw 0;
      s[myUser.team] = s[myUser.team].filter(x => x.id !== myUser.id);
    } else if (t === 'auto') {
      M.auto[myUser.id] = d.n;
    } else if (t === 'enter') {
      const s = M.S[d.n - 1];
      if (!s || !s.B) { watchSlot = 0; throw 0; }
      if (!s.B.units.some(u => u.id === myUser.id)) s.B.spec[myUser.id] = myUser.name;
    } else if (t === 'leave') {
      const s = M.S[d.n - 1];
      if (s && s.B && s.B.spec) delete s.B.spec[myUser.id];
      watchSlot = 0;
    } else if (t === 'upgrade') {
      const u = M.users.find(x => x.id === myUser.id);
      const k = d.skill, l = u ? (u.lv[k] || 0) : 99;
      if (!u || !LV[k] || l >= 4 || (u.xp || 0) < LV[k].c[l]) throw 0;
      u.xp -= LV[k].c[l];
      u.lv[k] = l + 1;
    } else if (t === 'resetStats') {
      adm();
      M.users.forEach(u => { if (d.id === 'all' || u.id === d.id) { u.xp = 0; u.lv = ZERO(); } });
    } else if (t === 'setTimes') {
      adm();
      M.times = d.times;
      M.S.forEach((s, i) => s.time = d.times[i]);
    } else if (t === 'forceStart') {
      adm();
      const s = M.S[d.n - 1];
      if (!s) throw 0;
      s.x = 0;
      ['P', 'D'].forEach(tm => {
        while (s[tm].length < 3) s[tm].push({ id: 'bot' + tm + s[tm].length, name: '봇' + tm + (s[tm].length + 1), team: tm, bot: 1 });
      });
      startBattle(s, M.users);
    } else if (t === 'addUser') {
      adm();
      if (!d.id || !d.pw || !d.name || !['P', 'D'].includes(d.team) || M.users.some(u => u.id === d.id || u.name === d.name)) throw 0;
      M.users.push({ id: d.id, pw: d.pw, name: d.name, team: d.team, role: 'user', xp: 0, lv: ZERO() });
    } else if (t === 'delUser') {
      adm();
      const i = M.users.findIndex(u => u.id === d.id && u.role !== 'admin');
      if (i < 0) throw 0;
      M.users.splice(i, 1);
      M.S.forEach(s => { if (!s.B) ['P', 'D'].forEach(tm => s[tm] = s[tm].filter(x => x.id !== d.id)); });
      if (M.auto) delete M.auto[d.id];
    } else if (t === 'resetDay') {
      adm();
      M.S = initSlots(M.times, M.auto, M.users);
    }
    await set(gameRef, M);
    cache = M;
    if (t === 'enter') publishState(M);
    if (t === 'upgrade') {
      const u = M.users.find(x => x.id === myUser.id);
      return { xp: u.xp, lv: u.lv };
    }
    return 1;
  }
};

 const up=e.target.closest('[data-up]');if(up)net.send('upgrade',{skill:up.dataset.up}).then(drawUp).catch(()=>{});
 if(e.target.dataset.r)net.send('resetStats',{id:e.target.dataset.r}).then(drawAdmin);
 if(e.target.id=='ra'&&confirm('모든 계정의 경험치와 스킬 단계를 초기화할까요?'))net.send('resetStats',{id:'all'}).then(drawAdmin);
 if(f){const n=+f.dataset.f;net.send('forceStart',{n}).then(()=>admMsg(`${n}타임 전투가 시작되었습니다.`)).catch(()=>admMsg('시작에 실패했습니다.'))}
 if(e.target.dataset.w)location.hash='#battle/'+e.target.dataset.w;
 if(e.target.id=='na')net.send('addUser',{id:$('#ni').value.trim(),pw:$('#np').value,name:$('#nn').value.trim(),team:$('#nt').value}).then(drawAdmin).catch(()=>$('#ae').textContent='추가할 수 없습니다. 모든 칸을 채우고, 아이디와 캐릭터 이름이 겹치지 않는지 확인하세요.');
 if(e.target.dataset.d)net.send('delUser',{id:e.target.dataset.d}).then(drawAdmin);
 if(e.target.id=='sv')net.send('setTimes',{times:[...document.querySelectorAll('[data-t]')].map(i=>i.value)}).then(()=>admMsg('전투 시간이 저장되었습니다.'));
 if(e.target.id=='rs')net.send('resetDay').then(()=>admMsg('오늘 신청 현황이 초기화되었습니다.'));
 if(e.target.id=='lo'){localStorage.removeItem('vos_auth');location.hash='#login';route()}
 const sk=e.target.closest('.skill'),cd=e.target.closest('.cd');
 if(sk){sel.k=sel.k==sk.dataset.k?null:sk.dataset.k;sel.t=null;upd()}
 if(cd&&sel.k&&sel.k!='inc'){const u=allU().find(x=>x.id==cd.dataset.u),ally=sel.k=='pro'||sel.k=='hea',mt=myUnit(),team=B.teams.P.includes(u)?'P':'D',my=B.teams.P.includes(mt)?'P':'D';
  if(u.hp>0&&(ally?team==my:team!=my))sel.t=u.id;upd()}
 if(e.target.id=='fold')$('.chat').classList.toggle('fold')};
const allU=()=>B?B.teams.P.concat(B.teams.D):[],myUnit=()=>allU().find(u=>u.id==me.id);
async function drawUp(){const pf=await net.send('profile');me.xp=pf.xp;me.lv=pf.lv;
 app.innerHTML=`<div class="ap-wrap"><div class="ap up"><h2>스킬 강화</h2><p class="xp">보유 경험치 <b>${pf.xp}</b></p>${Object.keys(SK).map(k=>{const l=pf.lv[k],c=LV[k].c[l],mx=l>=4;
 return`<section class="sl"><div class="hd"><span>${SK[k][0]}</span><span class="tm">Lv.${l}</span></div><div class="pips">${[1,2,3,4].map(i=>`<i class="${i<=l?'on':''}"></i>`).join('')}</div><p>현재: ${desc(k,l)}</p><p>${mx?'최대 단계입니다.':'다음: '+desc(k,l+1)}</p><button data-up="${k}" ${mx||pf.xp<c?'disabled':''}>▶ ${mx?'MAX':'강화하기'}<small>${mx?'':'경험치 '+c+' 소모'}</small></button></section>`}).join('')}
 <p class="nt">전투 종료 시 참가자에게만 지급: 승리 +5 · 패배 +2 · 무승부 +3</p><a class="bk" href="#apply">◀ 전투 신청으로</a></div></div>`}
async function drawAdmin(){const us=await net.send('users');
 app.innerHTML=`<div class="ad-wrap"><div class="ad"><h2>운영 페이지</h2><h3>전투 시간</h3>
 ${slots.map(s=>`<div><b>${s.n}타임</b><input type="time" data-t="${s.n}" value="${s.time}"><span data-st="${s.n}">${STL[s.status]}</span><button data-f="${s.n}">봇으로 채우고 즉시 시작</button><button class="sub" data-w="${s.n}">관전</button></div>`).join('')}
 <div id="adm-msg"></div>
 <div><button id="sv">시간 저장</button><button class="sub" id="rs">신청 초기화</button></div><h3>계정 관리</h3>
 <div><input id="ni" placeholder="아이디"><input id="np" placeholder="비밀번호"><input id="nn" placeholder="캐릭터 이름"><select id="nt"><option value="P">불사조 기사단</option><option value="D">죽음을 먹는 자</option></select><button id="na">추가</button></div><small id="ae"></small>
 <table><tr><th>아이디</th><th>캐릭터</th><th>진영</th><th>경험치</th><th>스킬 단계</th><th></th></tr>${us.filter(u=>u.role!='admin').map(u=>`<tr><td>${esc(u.id)}</td><td>${esc(u.name)}</td><td>${u.team=='P'?'불사조':'죽음'}</td><td>${u.xp}</td><td>${Object.values(u.lv).join('/')}</td><td><button class="sub" data-r="${esc(u.id)}">초기화</button> <button data-d="${esc(u.id)}">삭제</button></td></tr>`).join('')}</table>
 <small>스킬 단계 순서: 스투페파이/인센디오/프로테고/치유/엑스펠리아무스. 삭제하면 스탯도 함께 사라집니다.</small>
 <div><button id="ra">전체 스탯 초기화 (정식 오픈 전)</button><button class="sub" id="lo">로그아웃</button></div></div></div>`}
function buildBattle(){
 app.innerHTML=`<div class="vp"><div class="bt"><a class="home" href="${me.role=='admin'?'#admin':'#apply'}">◀HOME</a>
 <div class="sk">${Object.entries(SK).map(([k,v])=>`<div class="skill" data-k="${k}" data-tip="${v[2]}"><b>${v[0]}</b><div><em></em></div></div>`).join('')}</div>
 <div class="pn" id="pp"></div><h3 class="tl">Order Of The Phoenix</h3><h3 class="tl r">Death Eater</h3><div class="pn" id="dp"></div>
 <div class="lb" id="lb">사용 주문 이름</div><textarea id="tx" placeholder="이곳에 지문을 입력합니다."></textarea>
 <div class="score"><div>PHOENIX<b id="sp">0</b></div><div>DEATH<b id="sd">0</b></div></div><div class="spec" id="spec"></div>
 <div class="chat"><header><span id="clk"></span><button id="fold" aria-label="채팅 접기">▼</button></header><div id="msgs"></div></div></div></div>`;
 $('#tx').onkeydown=e=>{if(e.isComposing||e.key!='Enter'||e.shiftKey)return;e.preventDefault();
  const mt=myUnit();if(!B||!mt||B.over)return;if(B.cur!=me.id)return flash('아직 내 차례가 아닙니다.');
  if(!sel.k)return flash('사용할 주문을 선택하세요.');
  if(sel.k!='inc'&&!sel.t&&sel.k!='pro'&&sel.k!='hea')return flash('공격 대상을 클릭해 선택하세요.');
  net.send('act',{n:cur,skill:sel.k,target:sel.t||me.id,text:$('#tx').value.trim()}).then(()=>{$('#tx').value='';sel={k:null,t:null};upd()}).catch(()=>flash('사용할 수 없는 행동입니다.'))}}
function flash(t){const l=$('#lb');l.textContent=t;setTimeout(upd,1600)}
function upd(){try{upd0()}catch(e){const m=$('#msgs');if(m)m.textContent='화면 오류: '+e.message}}
function upd0(){if(!B||!$('#pp'))return;const mt=myUnit(),mine=mt&&B.cur==mt.id;
 const unit=u=>`<div class="cd ${u.hp<=0?'dead':''} ${B.cur==u.id?'on':''} ${sel.t==u.id?'tg':''}" data-u="${u.id}"><span>${u.tags.join(' · ')||'정상'}</span><div><b>${u.hp}</b><i>${esc(u.name)}</i></div></div>`;
 $('#pp').innerHTML=B.teams.P.map(unit).join('');$('#dp').innerHTML=B.teams.D.map(unit).join('');
 document.querySelectorAll('.skill').forEach(s=>{const k=s.dataset.k,n=mt?mt.uses[k]:0;s.querySelector('em').textContent=k=='stu'?'∞':n;const lvk=mt?(mt.lv[k]||0):0;s.querySelector('b').textContent=SK[k][0]+(lvk?' Lv.'+lvk:'');s.dataset.tip=desc(k,lvk);s.classList.toggle('sel',sel.k==k);s.classList.toggle('off',!mt||(k!='stu'&&n<1)||mt.hp<=0)});
 $('#sp').textContent=B.score.P;$('#sd').textContent=B.score.D;
 $('#spec').innerHTML=B.spec.length?B.spec.map(n=>`<span>${esc(n)}</span>`).join(''):'<span style="border:0;opacity:.5">관전자 없음</span>';
 const sl=slots.find(s=>s.n==B.n),c=allU().find(u=>u.id==B.cur);
 $('#clk').textContent=(sl?sl.time:'')+(B.over?' · END':' · ROUND '+B.turn);
 $('#lb').textContent=sel.k?SK[sel.k][0]:'사용 주문 이름';
 $('#tx').placeholder=!mt?'관전 중입니다.':B.over?'전투가 종료되었습니다.':mine?'내 차례입니다. 지문을 입력하고 Enter를 누르세요.':(c?c.name+'의 차례입니다.':'');
 const box=$('#msgs'),stick=box.scrollTop+box.clientHeight>=box.scrollHeight-40;
 box.innerHTML=B.log.map(l=>l.k=='sys'?`<div class="s">${esc(l.text)}</div>`:`<div class="m"><b>${esc(l.name)}${l.to?' ▸ '+esc(l.to):''}</b><br><p>${esc(l.text)}</p><small>${l.turn}번째 턴</small></div>`).join('');
 if(stick)box.scrollTop=box.scrollHeight}
const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1600,innerHeight/900)*.82);addEventListener('resize',fit);fit();

/* 저장된 로그인 정보로 자동 로그인 시도 */
(async()=>{
  try{
    const saved=JSON.parse(localStorage.getItem('vos_auth')||'null');
    if(saved&&saved.id&&saved.pw){
      me=await net.send('login',saved);
      await net.send('slots');
      if(!location.hash||location.hash=='#login')location.hash=me.role=='admin'?'#admin':'#apply';
    }
  }catch(e){localStorage.removeItem('vos_auth')}
  route();
})();
</script></body></html>
