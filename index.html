/* 운영 */

</style></head><body><div id="app"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, onValue, runTransaction, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBCG8EOJQVe2TeJLIfCWQqHnuLcMqsgEPU",
  authDomain: "vow-of-silence-e2c93.firebaseapp.com",
  databaseURL: "https://vow-of-silence-e2c93-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "vow-of-silence-e2c93",
  storageBucket: "vow-of-silence-e2c93.firebasestorage.app",
  messagingSenderId: "63020183712",
  appId: "1:63020183712:web:7a18d5c051d77b8a5759c5",
  measurementId: "G-ENSV95H5Y4"
};

const DEFAULT_USERS = [
  { id: 'harry', pw: '1234', name: '해리', team: 'P', role: 'user' },
  { id: 'ron', pw: '1234', name: '론', team: 'P', role: 'user' },
  { id: 'hermione', pw: '1234', name: '헤르미온느', team: 'P', role: 'user' },
  { id: 'draco', pw: '1234', name: '드레이코', team: 'D', role: 'user' },
  { id: 'bella', pw: '1234', name: '벨라트릭스', team: 'D', role: 'user' },
  { id: 'lucius', pw: '1234', name: '루시우스', team: 'D', role: 'user' },
  { id: 'admin', pw: 'admin', name: '관리자', team: 0, role: 'admin' }
];

const appFB = initializeApp(firebaseConfig);
const db = getDatabase(appFB);
const gameRef = ref(db, 'vow_of_silence_game');

const SK = {
  stu: ['스투페파이', 10, '단일 공격 (5~20). 대상의 체력이 낮을수록 더 큰 피해 (무제한)'],
  inc: ['인센디오', 2, '상대 진영 전체 공격 (3~15). 전투 중 2회'],
  pro: ['프로테고', 3, '같은 진영 1인의 피해를 5~20 막음. 3회'],
  hea: ['치유 주문', 1, '같은 진영 1인의 HP를 1~99 회복. 1회'],
  exp: ['엑스펠리아무스', 3, '상대를 1~3턴 일시 불능으로 만듦. 3회']
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[R(0, a.length - 1)];
const shuf = a => a.map(x => [Math.random(), x]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
const kstDay = () => new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Seoul' });
const kstNow = () => new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Seoul' }));

let cache = null, myUser = null, watchSlot = 0, botTimer = null;

function initSlots(times, auto, users) {
  const S = times.map((time, i) => ({ n: i + 1, time, P: [], D: [], B: null, x: 0 }));
  Object.entries(auto || {}).forEach(([id, n]) => {
    if (!n) return;
    const u = users.find(x => x.id === id), s = S[n - 1];
    if (u && s && u.team && s[u.team].length < 3 && !s[u.team].some(x => x.id === u.id)) {
      s[u.team].push({ id: u.id, name: u.name, team: u.team });
    }
  });
  return S;
}

function norm(raw) {
  const today = kstDay();
  const users = raw && raw.users ? (Array.isArray(raw.users) ? raw.users : Object.values(raw.users)) : DEFAULT_USERS.map(u => ({ ...u }));
  if (!users.some(u => u.role === 'admin')) users.push({ id: 'admin', pw: 'admin', name: '관리자', team: 0, role: 'admin' });
  if (!raw || !raw.times) {
    const times = ['16:00', '17:00', '18:00', '19:00'];
    return { day: today, times, auto: {}, users, S: initSlots(times, {}, users) };
  }
  const times = Array.isArray(raw.times) ? raw.times : Object.values(raw.times);
  const auto = raw.auto || {};
  if (raw.day !== today) return { day: today, times, auto, users, S: initSlots(times, auto, users) };
  const rawS = raw.S ? (Array.isArray(raw.S) ? raw.S : Object.values(raw.S)) : initSlots(times, auto, users);
  const S = rawS.map((s, i) => ({
    n: s.n || i + 1,
    time: s.time || times[i] || '16:00',
    P: s.P ? Object.values(s.P) : [],
    D: s.D ? Object.values(s.D) : [],
    x: s.x || 0,
    B: s.B ? {
      n: s.B.n || s.n || i + 1,
      turn: s.B.turn || 0,
      i: s.B.i ?? -1,
      cur: s.B.cur || null,
      order: s.B.order ? Object.values(s.B.order) : [],
      units: s.B.units ? Object.values(s.B.units) : [],
      log: s.B.log ? Object.values(s.B.log) : [],
      spec: s.B.spec || {},
      over: s.B.over || null,
      sc: s.B.sc || { P: 0, D: 0 },
      dm: s.B.dm || { P: 0, D: 0 },
      end: s.B.end || Date.now() + 36e5,
      pend: {
        dmg: (s.B.pend && s.B.pend.dmg) || {},
        sh: (s.B.pend && s.B.pend.sh) || {},
        heal: (s.B.pend && s.B.pend.heal) || {},
        exp: (s.B.pend && s.B.pend.exp) || {}
      }
    } : null
  }));
  return { day: raw.day, times, auto, users, S };
}

const tg = u => u.hp <= 0 ? ['행동 불능'] : [...(u.inc ? ['일시 불능'] : []), ...(u.hp < 30 ? ['빈사'] : [])];
const st = s => s.B ? (s.B.over ? 'done' : 'live') : s.x ? 'cancel' : s.P.length + s.D.length === 6 ? 'full' : 'open';
const sys = (B, text) => B.log.push({ k: 'sys', text });

function viewBattle(B) {
  const t = x => B.units.filter(u => u.team === x).map(u => ({ id: u.id, name: u.name, hp: u.hp, tags: tg(u), uses: u.uses }));
  return { n: B.n, turn: B.turn, cur: B.cur || null, teams: { P: t('P'), D: t('D') }, score: B.sc, spec: Object.values(B.spec || {}), log: B.log, over: B.over };
}

function startBattle(s) {
  const mk = u => ({ id: u.id, name: u.name, team: u.team, hp: 100, inc: 0, bot: !!u.bot, uses: { stu: 10, inc: 2, pro: 3, hea: 1, exp: 3 } });
  const B = s.B = { n: s.n, turn: 0, i: -1, cur: null, order: [], units: [...s.P, ...s.D].map(mk), log: [], spec: {}, over: null, sc: { P: 0, D: 0 }, dm: { P: 0, D: 0 }, end: Date.now() + 36e5, pend: { dmg: {}, sh: {}, heal: {}, exp: {} } };
  sys(B, '전투가 시작되었습니다.');
  nextTurn(B);
}

function nextTurn(B) {
  B.turn++;
  B.order = shuf(B.units.filter(u => u.hp > 0 && !u.inc).map(u => u.id));
  B.i = -1;
  B.pend = { dmg: {}, sh: {}, heal: {}, exp: {} };
  advance(B);
}

function advance(B) {
  B.i++;
  if (B.i >= B.order.length) { B.cur = null; return endTurn(B); }
  B.cur = B.order[B.i];
}

function applyAct(B, uid, d) {
  if (B.over || B.cur !== uid) return false;
  const u = B.units.find(x => x.id === uid);
  if (!u) return false;
  if (u.bot && !d.skill) {
    const en = B.units.filter(x => x.team !== u.team && x.hp > 0);
    const al = B.units.filter(x => x.team === u.team && x.hp > 0);
    const ks = Object.keys(u.uses).filter(k => (k === 'stu' || u.uses[k] > 0) && (k !== 'hea' || al.some(a => a.hp < 60)));
    if (ks.length && en.length) {
      const skill = pick(ks);
      d = { skill, target: (skill === 'pro' || skill === 'hea' ? pick(al) : pick(en)).id, text: '주문을 외우며 지팡이를 겨눈다.' };
    }
  }
  const k = d.skill, P = B.pend;
  if (!k) {
    sys(B, `${u.name}이(가) 행동하지 않았습니다.`);
  } else {
    if (!SK[k] || (k !== 'stu' && u.uses[k] < 1)) return false;
    const ally = k === 'pro' || k === 'hea';
    const t = B.units.find(x => x.id === d.target) || (ally ? u : null);
    if (k !== 'inc' && (!t || t.hp <= 0 || (ally ? t.team !== u.team : t.team === u.team))) return false;
    const add = (o, id, v) => o[id] = (o[id] || 0) + v;
    let lab = '데미지', v = 0, eff = '없음';
    if (k !== 'stu') u.uses[k]--;
    if (k === 'stu') { v = Math.round(R(5, 20) * (2 - t.hp / 100)); add(P.dmg, t.id, v); }
    else if (k === 'inc') B.units.filter(x => x.team !== u.team && x.hp > 0).forEach(x => { const w = R(3, 15); v += w; add(P.dmg, x.id, w); });
    else if (k === 'pro') { lab = '방어'; v = R(5, 20); add(P.sh, t.id, v); }
    else if (k === 'hea') { lab = '회복'; v = R(1, 99); add(P.heal, t.id, v); }
    else { P.exp[t.id] = R(1, 3); eff = '일시 불능'; }
    B.log.push({ k: 'chat', name: u.name, text: d.text || '(말없이 지팡이를 든다)', turn: B.turn });
    sys(B, `${u.name}이(가) ${SK[k][0]}을(를) 사용하였습니다. ${lab} ${v}, 특수효과 ${eff} 적용.`);
  }
  advance(B);
  return true;
}

function endTurn(B) {
  const P = B.pend, L = [];
  B.units.forEach(u => { if (u.inc > 0) { u.inc--; if (!u.inc) L.push(`${u.name}: [일시 불능] 해제되었습니다.`); } });
  B.units.forEach(u => {
    const raw = P.dmg[u.id] || 0, sh = P.sh[u.id] || 0, hl = P.heal[u.id] || 0, d = Math.max(0, raw - sh), old = u.hp;
    u.hp = Math.max(0, Math.min(100, old - d + hl));
    const lost = Math.min(d, old);
    B.dm[u.team === 'P' ? 'D' : 'P'] += lost;
    if (raw) L.push(sh ? `${u.name}: 방어로 ${Math.min(raw, sh)} 막아냄, ${d} 데미지 (HP ${u.hp})` : `${u.name}: ${d} 데미지를 입었습니다. (HP ${u.hp})`);
    else if (sh) L.push(`${u.name}: 방어가 발동됩니다. HP 차감 없음`);
    if (hl) L.push(`${u.name}: HP ${u.hp - old + d > 0 ? u.hp - old + d : hl} 회복 (HP ${u.hp})`);
    if (u.hp <= 0) { u.inc = 0; if (old > 0) L.push(`${u.name}: [행동 불능] 상태가 되었습니다.`); }
    else if (P.exp[u.id]) { u.inc = P.exp[u.id]; L.push(`${u.name}: [일시 불능] ${B.turn + u.inc}턴까지 지속`); }
  });
  B.sc.P = Math.floor(B.dm.P / 10);
  B.sc.D = Math.floor(B.dm.D / 10);
  sys(B, `— ${B.turn}번째 턴 종료 —`);
  L.forEach(t => sys(B, t));
  const dead = x => B.units.filter(u => u.team === x).every(u => u.hp <= 0);
  if (dead('P') || dead('D')) return finBattle(B, '전원 행동 불능');
  nextTurn(B);
}

function finBattle(B, why) {
  const t = x => B.units.filter(u => u.team === x).reduce((a, u) => a + u.hp, 0);
  const w = B.sc.P !== B.sc.D ? (B.sc.P > B.sc.D ? 'P' : 'D') : t('P') === t('D') ? '' : t('P') > t('D') ? 'P' : 'D';
  B.over = { w };
  B.cur = null;
  sys(B, `전투 종료 (${why}). ${w ? (w === 'P' ? '불사조 기사단' : '죽음을 먹는 자') + '의 승리!' : '무승부'}`);
}

function publishState(M) {
  net.emit('slots', M.S.map(s => ({ n: s.n, time: s.time, P: s.P.map(u => u.name), D: s.D.map(u => u.name), score: s.B ? [s.B.sc.P, s.B.sc.D] : [0, 0], status: st(s) })));
  const s = M.S[watchSlot - 1];
  if (s && s.B) {
    net.emit('battle', viewBattle(s.B));
    const curU = s.B.units.find(u => u.id === s.B.cur);
    clearTimeout(botTimer);
    if (myUser && curU && curU.bot && !s.B.over) {
      const targetSlot = watchSlot, targetBotId = curU.id;
      botTimer = setTimeout(() => runTransaction(gameRef, raw => {
        if (!raw) return;
        const m = norm(raw), b = m.S[targetSlot - 1]?.B;
        if (b && b.cur === targetBotId && !b.over) applyAct(b, targetBotId, {});
        return m;
      }), 1000);
    }
  }
}

onValue(gameRef, snap => {
  cache = norm(snap.val());
  if (!snap.exists()) runTransaction(gameRef, raw => norm(raw));
  publishState(cache);
});

setInterval(() => {
  if (!cache) return;
  const now = kstNow(), today = kstDay();
  let need = cache.day !== today;
  cache.S.forEach(s => {
    const [h, m] = s.time.split(':'), t = kstNow();
    t.setHours(+h, +m, 0, 0);
    if (!s.B && !s.x && now >= t) need = true;
    if (s.B && !s.B.over && Date.now() > s.B.end) need = true;
  });
  if (need) {
    runTransaction(gameRef, raw => {
      if (!raw) return;
      const M = norm(raw);
      M.S.forEach(s => {
        const [h, m] = s.time.split(':'), t = kstNow();
        t.setHours(+h, +m, 0, 0);
        if (!s.B && !s.x && now >= t) {
          if (s.P.length + s.D.length === 6) startBattle(s);
          else s.x = 1;
        }
        if (s.B && !s.B.over && Date.now() > s.B.end) finBattle(s.B, '제한 시간 1시간 경과');
      });
      return M;
    });
  }
}, 3000);

const net = {
  h: {},
  on(t, f) { (this.h[t] = this.h[t] || []).push(f); },
  emit(t, d) { (this.h[t] || []).forEach(f => f(d)); },
  async send(t, d = {}) {
    if (!cache) {
      const snap = await get(gameRef);
      cache = norm(snap.val());
    }
    if (t === 'login') {
      const u = cache.users.find(x => x.id === d.id && x.pw === d.pw);
      if (!u) throw 0;
      myUser = u;
      return { id: u.id, name: u.name, team: u.team, role: u.role, auto: (cache.auto && cache.auto[u.id]) || 0 };
    }
    if (t === 'slots') { publishState(cache); return 1; }
    if (!myUser) throw 0;
    const adm = () => { if (myUser.role !== 'admin') throw 0; };
    if (t === 'users') { adm(); return cache.users.map(u => ({ id: u.id, name: u.name, team: u.team, role: u.role })); }
    if (t === 'enter') watchSlot = d.n;
    let ok = true;
    await runTransaction(gameRef, raw => {
      const M = norm(raw);
      if (t === 'apply') {
        const s = M.S[d.n - 1];
        if (!s || s.B || s.x || !myUser.team || s[myUser.team].length >= 3 || s[myUser.team].some(x => x.id === myUser.id)) { ok = false; return; }
        s[myUser.team].push({ id: myUser.id, name: myUser.name, team: myUser.team });
      } else if (t === 'cancel') {
        const s = M.S[d.n - 1];
        if (!s || s.B) { ok = false; return; }
        s[myUser.team] = s[myUser.team].filter(x => x.id !== myUser.id);
      } else if (t === 'auto') {
        M.auto[myUser.id] = d.n;
      } else if (t === 'enter') {
        const s = M.S[d.n - 1];
        if (!s || !s.B) { ok = false; return; }
        if (!s.B.units.some(u => u.id === myUser.id)) s.B.spec[myUser.id] = myUser.name;
      } else if (t === 'leave') {
        const s = M.S[d.n - 1];
        if (s && s.B && s.B.spec) delete s.B.spec[myUser.id];
        watchSlot = 0;
      } else if (t === 'act') {
        const B = M.S[d.n - 1]?.B;
        if (!B || !applyAct(B, myUser.id, d)) { ok = false; return; }
      } else if (t === 'setTimes') {
        adm();
        M.times = d.times;
        M.S.forEach((s, i) => s.time = d.times[i]);
      } else if (t === 'forceStart') {
        adm();
        const s = M.S[d.n - 1];
        if (!s) { ok = false; return; }
        s.x = 0;
        ['P', 'D'].forEach(tm => {
          while (s[tm].length < 3) s[tm].push({ id: 'bot' + tm + s[tm].length, name: '봇' + tm + (s[tm].length + 1), team: tm, bot: 1 });
        });
        startBattle(s);
      } else if (t === 'addUser') {
        adm();
        if (!d.id || !d.pw || !d.name || !['P', 'D'].includes(d.team) || M.users.some(u => u.id === d.id || u.name === d.name)) { ok = false; return; }
        M.users.push({ id: d.id, pw: d.pw, name: d.name, team: d.team, role: 'user' });
      } else if (t === 'delUser') {
        adm();
        const i = M.users.findIndex(u => u.id === d.id && u.role !== 'admin');
        if (i < 0) { ok = false; return; }
        M.users.splice(i, 1);
        M.S.forEach(s => { if (!s.B) ['P', 'D'].forEach(tm => s[tm] = s[tm].filter(x => x.id !== d.id)); });
        if (M.auto) delete M.auto[d.id];
      } else if (t === 'resetDay') {
        adm();
        M.S = initSlots(M.times, M.auto, M.users);
      }
      return M;
    });
    if (!ok) { if (t === 'enter') watchSlot = 0; throw 0; }
    if (t === 'enter' && cache) publishState(cache);
    return 1;
  }
};

 const go=async()=>{try{me=await net.send('login',{id:$('#u').value.trim(),pw:$('#p').value});await net.send('slots');location.hash=me.role=='admin'?'#admin':'#apply';route()}catch(e){$('#er').textContent='아이디 또는 비밀번호가 일치하지 않습니다.'}};
 $('#p').onkeydown=e=>{if(e.key=='Enter')go()};$('#u').onkeydown=e=>{if(e.key=='Enter')$('#p').focus()};$('#u').focus()}
function drawApply(){const ap=(t)=>{const[h]=t.split(':');return t+(+h>=12?' P.M':' A.M')},pills=a=>[0,1,2].map(i=>a[i]?`<div class="pl">${esc(a[i])}</div>`:`<div class="pl e">캐릭터 이름</div>`).join('');

 app.innerHTML=`<div class="ap-wrap"><div class="ap"><h2>전투 신청</h2><label class="au">자정 자동 신청 <select id="au"><option value="0">사용 안 함</option>${slots.map(s=>`<option value="${s.n}" ${me.auto==s.n?'selected':''}>${s.n}타임</option>`).join('')}</select></label>
 ${slots.map(s=>{const mine=inSlot(s),left=me.team?3-s[me.team].length:0,play=mine&&(s.status=='live'||s.status=='done');
 return`<section class="sl"><div class="hd"><span>${s.n}타임</span><span class="tm">${ap(s.time)}</span></div>
 <div class="scb"><span>SCORE</span><div class="nums"><b>${s.score[0]}</b><b>${s.score[1]}</b></div><small>PHOENIX · DEATH EATER</small></div>
 <div class="nm"><i>신청 현황</i><div>${pills(s.P)}${pills(s.D)}</div></div>
 <div class="bs"><button data-a="${mine?'cancel':'apply'}" data-n="${s.n}" ${s.status!='open'||!me.team||(!mine&&!left)?'disabled':''}>▶ ${mine?'신청 취소':'신청하기'}<small>진영 잔여 좌석 수: ${left}</small></button>
 <button data-a="watch" data-n="${s.n}" ${['live','done'].includes(s.status)?'':'disabled'}>▶ ${play?'입장하기':'관전하기'}<small>${lab[s.status]}</small></button></div></section>`}).join('')}</div></div>`;
 $('#au').onchange=e=>{me.auto=+e.target.value;net.send('auto',{n:me.auto})}}
function admMsg(t){const el=$('#adm-msg');if(el)el.textContent=t}
app.onclick=async e=>{const b=e.target.closest('button[data-a]'),f=e.target.closest('[data-f]');
 if(b){const n=+b.dataset.n,a=b.dataset.a;if(a=='watch')location.hash='#battle/'+n;else net.send(a,{n}).catch(()=>{})}
 if(f){const n=+f.dataset.f;net.send('forceStart',{n}).then(()=>admMsg(`${n}타임 전투가 시작되었습니다.`)).catch(()=>admMsg('시작에 실패했습니다.'))}
 if(e.target.dataset.w)location.hash='#battle/'+e.target.dataset.w;
 if(e.target.id=='na')net.send('addUser',{id:$('#ni').value.trim(),pw:$('#np').value,name:$('#nn').value.trim(),team:$('#nt').value}).then(drawAdmin).catch(()=>$('#ae').textContent='추가할 수 없습니다. 모든 칸을 채우고, 아이디와 캐릭터 이름이 겹치지 않는지 확인하세요.');
 if(e.target.dataset.d)net.send('delUser',{id:e.target.dataset.d}).then(drawAdmin);
 if(e.target.id=='sv')net.send('setTimes',{times:[...document.querySelectorAll('[data-t]')].map(i=>i.value)}).then(()=>admMsg('전투 시간이 저장되었습니다.'));
 if(e.target.id=='rs')net.send('resetDay').then(()=>admMsg('오늘 신청 현황이 초기화되었습니다.'));
 if(e.target.id=='lo')location.hash='#login';
 const sk=e.target.closest('.skill'),cd=e.target.closest('.cd');
 if(sk){sel.k=sel.k==sk.dataset.k?null:sk.dataset.k;sel.t=null;upd()}
 if(cd&&sel.k&&sel.k!='inc'){const u=allU().find(x=>x.id==cd.dataset.u),ally=sel.k=='pro'||sel.k=='hea',mt=myUnit(),team=B.teams.P.includes(u)?'P':'D',my=B.teams.P.includes(mt)?'P':'D';
  if(u.hp>0&&(ally?team==my:team!=my))sel.t=u.id;upd()}
 if(e.target.id=='fold')$('.chat').classList.toggle('fold')};
const allU=()=>B?B.teams.P.concat(B.teams.D):[],myUnit=()=>allU().find(u=>u.id==me.id);
async function drawAdmin(){const us=await net.send('users');
 app.innerHTML=`<div class="ad-wrap"><div class="ad"><h2>운영 페이지</h2><h3>전투 시간</h3>
 ${slots.map(s=>`<div><b>${s.n}타임</b><input type="time" data-t="${s.n}" value="${s.time}"><span data-st="${s.n}">${STL[s.status]}</span><button data-f="${s.n}">봇으로 채우고 즉시 시작</button><button class="sub" data-w="${s.n}">관전</button></div>`).join('')}
 <div id="adm-msg"></div>
 <div><button id="sv">시간 저장</button><button class="sub" id="rs">신청 초기화</button></div><h3>계정 관리</h3>

 <table><tr><th>아이디</th><th>캐릭터</th><th>진영</th><th></th></tr>${us.filter(u=>u.role!='admin').map(u=>`<tr><td>${esc(u.id)}</td><td>${esc(u.name)}</td><td>${u.team=='P'?'불사조 기사단':'죽음을 먹는 자'}</td><td><button data-d="${esc(u.id)}">삭제</button></td></tr>`).join('')}</table>
 <div><button id="lo">로그아웃</button></div></div></div>`}
function buildBattle(){
 app.innerHTML=`<div class="vp"><div class="bt"><a class="home" href="${me.role=='admin'?'#admin':'#apply'}">◀HOME</a>
 <div class="sk">${Object.entries(SK).map(([k,v])=>`<div class="skill" data-k="${k}" data-tip="${v[2]}"><b>${v[0]}</b><div><em></em></div></div>`).join('')}</div>
 <div class="pn" id="pp"></div><h3 class="tl">Order Of The Phoenix</h3><h3 class="tl r">Death Eater</h3><div class="pn" id="dp"></div>
 <div class="lb" id="lb">사용 주문 이름</div><textarea id="tx" placeholder="이곳에 지문을 입력합니다."></textarea>
 <div class="score"><div>PHOENIX<b id="sp">0</b></div><div>DEATH<b id="sd">0</b></div></div><div class="spec" id="spec"></div>
 <div class="chat"><header><span id="clk"></span><button id="fold" aria-label="채팅 접기">▼</button></header><div id="msgs"></div></div></div></div>`;
 $('#tx').onkeydown=e=>{if(e.isComposing||e.key!='Enter'||e.shiftKey)return;e.preventDefault();
  const mt=myUnit();if(!B||!mt||B.over)return;if(B.cur!=me.id)return flash('아직 내 차례가 아닙니다.');

  net.send('act',{n:cur,skill:sel.k,target:sel.t||me.id,text:$('#tx').value.trim()}).then(()=>{$('#tx').value='';sel={k:null,t:null};upd()}).catch(()=>flash('사용할 수 없는 행동입니다.'))}}
